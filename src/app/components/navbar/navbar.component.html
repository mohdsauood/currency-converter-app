<header class="app-header">

  <div class="header-brand">
    <img src="assets/logo.svg" alt="Exchange logo" class="brand-logo" />
    <span class="brand-name">Exchange</span>
  </div>

  <div class="header-actions">

    <label class="theme-toggle" aria-label="Toggle dark mode">
      <span class="toggle-label">
        <svg class="moon-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="toggle-text">Dark Mode</span>
      </span>

      <div class="toggle-wrapper">
        <input type="checkbox" class="toggle-input" [checked]="themeService.isDarkMode"
          (change)="themeService.toggleTheme()" aria-label="Switch dark mode" />
        <span class="toggle-track">
          <span class="toggle-thumb"></span>
        </span>
      </div>
    </label>

    <nav class="header-nav" aria-label="Currency pair navigation">
      <button class="nav-btn" type="button">EUR-USD Details</button>
      <button class="nav-btn" type="button">EUR-GBP Details</button>
    </nav>

  </div>
</header>
