<div class="chart-card">

    <!-- Header row -->
    <div class="chart-header">
        <h3 class="chart-title">
            Historical Rates ({{ fromCode }} to {{ toCode }}) &ndash; Last 12 Months
        </h3>
        <div class="chart-period-badge">
            <svg class="period-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <rect x="1" y="2" width="14" height="13" rx="2" stroke="currentColor" stroke-width="1.4" />
                <path d="M1 6h14" stroke="currentColor" stroke-width="1.4" />
                <path d="M5 1v2M11 1v2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
            </svg>
            <span>Past 1 Year</span>
            <svg class="chevron-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
        </div>
    </div>

    <!-- Loading skeleton -->
    <div class="chart-loading" *ngIf="isLoading" aria-label="Loading chart">
        <span class="loading-spinner"></span>
        <span>Loading historical data&hellip;</span>
    </div>

    <!-- SVG Chart -->
    <div class="chart-wrap" *ngIf="!isLoading && points.length > 0" (mouseleave)="onLeave()">
        <svg [attr.viewBox]="'0 0 ' + VW + ' ' + VH" class="chart-svg" aria-label="Historical exchange rate chart"
            role="img">

            <defs>
                <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.28" />
                    <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.02" />
                </linearGradient>
            </defs>

            <!-- Y-axis rotated label -->
            <text class="axis-label" [attr.x]="-(MT + cH / 2)" y="13" text-anchor="middle" transform="rotate(-90)">
                Exchange Rate ({{ toCode }})
            </text>

            <!-- Horizontal grid lines + Y-axis tick labels -->
            <g class="grid">
                <ng-container *ngFor="let tick of yTicks">
                    <line [attr.x1]="ML" [attr.y1]="tick.y" [attr.x2]="ML + cW" [attr.y2]="tick.y"
                        stroke-dasharray="4 3" class="grid-line" />
                    <text [attr.x]="ML - 8" [attr.y]="tick.y + 4" text-anchor="end" class="tick-label">{{ tick.label
                        }}</text>
                </ng-container>
            </g>

            <!-- X-axis month labels -->
            <g class="x-axis">
                <text *ngFor="let p of points; let i = index" [attr.x]="p.x" [attr.y]="MT + cH + 22"
                    text-anchor="middle" class="tick-label">{{ p.month }}</text>
            </g>

            <!-- Area fill -->
            <path [attr.d]="areaPath" fill="url(#areaFill)" />

            <!-- Line -->
            <path [attr.d]="linePath" class="chart-line" />

            <!-- Per-point elements -->
            <g *ngFor="let p of points; let i = index">

                <!-- Value label above the dot -->
                <text [attr.x]="p.x" [attr.y]="p.y - 10" text-anchor="middle" class="point-label">{{ p.rate }}</text>

                <!-- Vertical dashed drop line on hover -->
                <line *ngIf="hoveredIndex === i" [attr.x1]="p.x" [attr.y1]="p.y" [attr.x2]="p.x" [attr.y2]="MT + cH"
                    class="drop-line" />

                <!-- Hit area (invisible, large) -->
                <rect [attr.x]="p.x - 20" [attr.y]="MT" width="40" [attr.height]="cH" fill="transparent"
                    style="cursor:pointer" (mouseenter)="onHover(i)" />

                <!-- Dot -->
                <circle [attr.cx]="p.x" [attr.cy]="p.y" [attr.r]="hoveredIndex === i ? 6 : 4"
                    [class.dot--active]="hoveredIndex === i" class="dot" (mouseenter)="onHover(i)" />

                <!-- Tooltip -->
                <g *ngIf="hoveredIndex === i" [attr.transform]="tooltipTransform(p)">
                    <rect width="148" height="52" rx="6" class="tooltip-bg" />
                    <text x="10" y="20" class="tooltip-title">{{ p.month }}: {{ p.rate }}</text>
                    <text x="10" y="38" class="tooltip-sub">Monthly Closing Rate</text>
                </g>

            </g>

        </svg>
    </div>

    <!-- Footer note -->
    <div class="chart-footer" *ngIf="!isLoading && points.length > 0">
        <svg class="info-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="10" cy="10" r="9" stroke="currentColor" stroke-width="1.5" />
            <path d="M10 9v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <circle cx="10" cy="6.5" r="0.75" fill="currentColor" />
        </svg>
        <span>Monthly closing rates are the exchange rates on the last day of each month.</span>
    </div>

</div>
